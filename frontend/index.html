<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Product Search</title>
    <meta name="description" content="Search products across trusted stores. Compare prices and buy directly from merchants.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="container">
        <!-- Search Section (Hero) -->
        <section id="search-section" class="search-section">
            <div class="search-pill">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search products or speak your query"
                    aria-label="Search products"
                    autocomplete="off"
                />
                <button id="clear-button" class="clear-button hidden" aria-label="Clear search">
                    <i class="fas fa-xmark"></i>
                </button>
                <div class="mic-divider"></div>
                <button id="mic-button" class="mic-button" aria-label="Voice search" data-tooltip="Press to search with voice">
                    <i class="fas fa-microphone"></i>
                    <div class="voice-waves hidden">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>
                <button id="search-button" class="search-button" aria-label="Search">
                    Search
                </button>
            </div>
            <div class="trust-indicators">
                <span><i class="fas fa-bolt"></i> <b>Scan 1M+ live prices</b></span>
                <span class="separator">•</span>
                <span><b>No signup</b></span>
                <span class="separator">•</span>
                <span><b>Verified stores</b></span>
            </div>
            <div id="voice-status" class="voice-status hidden"></div>
        </section>

        <!-- Category Chips Section (hidden initially) -->
        <section id="category-section" class="category-section hidden">
            <div class="category-chips" id="category-chips">
                <!-- Categories will be dynamically inserted here -->
            </div>
        </section>

        <!-- Filter Bar (hidden initially) -->
        <section id="filter-bar" class="filter-bar hidden">
            <button id="filter-button" class="filter-chip-btn">
                <i class="fas fa-sliders"></i>
                <span>Filters</span>
            </button>
            <div id="active-filters" class="active-filters">
                <!-- Active filter pills will be inserted here -->
            </div>
        </section>

        <!-- Results Section (hidden initially) -->
        <section id="results-section" class="results-section hidden">
            <div id="results-container" class="results-container"></div>
        </section>

        <!-- Loading State -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="error hidden"></div>
    </main>

    <!-- Category Bottom Sheet -->
    <div id="category-bottom-sheet" class="bottom-sheet-overlay hidden">
        <div class="bottom-sheet-content">
            <div class="sheet-handle"></div>
            <h3 class="sheet-title">All Categories</h3>
            <div id="category-list" class="category-list">
                <!-- Full category list will be inserted here -->
            </div>
        </div>
    </div>
    <div id="bottom-sheet-backdrop" class="bottom-sheet-backdrop hidden"></div>

    <!-- Footer -->
    <footer class="footer">
        <a href="/merchants.html">For merchants</a>
        <span class="separator">•</span>
        <a href="/partners.html">Partner / White-label</a>
        <span class="separator">•</span>
        <a href="/privacy.html">Privacy</a>
        <span class="separator">•</span>
        <a href="/legal.html">Legal</a>
    </footer>

    <script type="module" src="js/app.js?v=20260212"></script>
</body>
</html>
