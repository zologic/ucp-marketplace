server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Handle /admin-ui prefix by rewriting internally
    location /admin-ui/ {
        rewrite ^/admin-ui/(.*) /$1 break;
        try_files $uri $uri/ /index.html;

        # Never cache HTML files
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    # Redirect /admin-ui to /admin-ui/
    location = /admin-ui {
        return 301 /admin-ui/;
    }

    # Cache static assets (with /admin-ui prefix handled)
    location /admin-ui/assets/ {
        rewrite ^/admin-ui/(.*) /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback for direct access without prefix (shouldn't happen but handle it)
    location / {
        try_files $uri $uri/ /index.html;

        # Never cache HTML files
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json;
}
