version: '3.9'

services:
  # Caddy reverse proxy for multi-domain routing and automatic SSL
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    networks:
      - public
    restart: unless-stopped

  # Frontend - Nginx serving static files
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - public
    restart: unless-stopped

  # Admin Dashboard - React admin interface (Plain JavaScript + Vite)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: ucpready-admin
    networks:
      - public
    depends_on:
      - api
    restart: unless-stopped

  # API - Backend REST API + Worker (Merged for 7-container compliance)
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ucpready
      - REDIS_URL=redis://redis:6379
      - MCP_URL=http://mcp-server:8080
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - NODE_ENV=production
      - API_PORT=3000
      - RUN_WORKER=true
      - DOMAIN=${DOMAIN:-localhost}
      - TENANT_NAME=${TENANT_NAME:-Marketplace}
      - TENANT_REVENUE_PERCENTAGE=${TENANT_REVENUE_PERCENTAGE:-80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mcp-server:
        condition: service_started
    networks:
      - public
      - internal
    restart: unless-stopped
    command: sh -c "npm run init-db && node migrate.js && node server.js"

  # MCP Server - AI orchestration middleware
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/ucpready
      - API_INTERNAL_URL=http://api:3000
      - NODE_ENV=production
      - MCP_PORT=8080
    secrets:
      - platform_private_key
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=ucpready
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # Redis cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

# Docker secrets for sensitive data
secrets:
  platform_private_key:
    file: ./secrets/platform_private_key.pem

# Persistent volumes
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

# Networks
networks:
  public:
    driver: bridge
  internal:
    driver: bridge
