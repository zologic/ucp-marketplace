server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Strip /admin-ui prefix and serve from root
    # Vite builds with base: '/admin-ui/' so assets are at /admin-ui/assets/*
    # But we need to serve them from /usr/share/nginx/html/assets/*
    location /admin-ui/ {
        # Rewrite /admin-ui/path to /path
        rewrite ^/admin-ui(/.*)$ $1 break;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
